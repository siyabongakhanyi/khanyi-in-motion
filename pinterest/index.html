<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f6f3eb">
<meta name="description" content="Khanyi in Motion — connected Pinterest profile and boards.">
<title>Pinterest — Khanyi in Motion</title>
<style>
:root{--paper:#f6f3eb;--ink:#171613;--muted:#6b695f;--orange:#e65426;--white:#fffdf7;--line:#b9b3a6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}
.shell{max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,72px)}
.skip{position:absolute;left:-9999px}
.skip:focus{left:15px;top:10px;background:#fff;padding:12px;z-index:100}
.site-header{height:86px;border-bottom:1px solid var(--ink);display:flex;align-items:center;justify-content:space-between;gap:20px}
.wordmark{display:flex;align-items:center;gap:12px;font-size:11px;font-weight:900;letter-spacing:.13em;text-decoration:none}
.mark{display:grid;place-items:center;width:43px;height:43px;border-radius:50%;background:var(--ink);color:var(--paper);font-size:18px;letter-spacing:-.09em}
.home-link{font-size:11px;letter-spacing:.13em;font-weight:900;text-decoration:none;text-transform:uppercase;border-bottom:1px solid currentColor;padding-bottom:5px}
.home-link:hover,.external:hover{color:var(--orange)}
.hero{padding:85px 0 55px;border-bottom:1px solid var(--ink)}
.eyebrow{display:flex;align-items:center;gap:15px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:900}
.eyebrow::before{content:"";width:30px;height:2px;background:var(--orange)}
h1,h2,h3,p{margin-top:0}
h1{font-size:clamp(64px,10vw,144px);line-height:.85;letter-spacing:-.09em;font-weight:900;margin:32px 0 0}
h1 span{color:var(--orange)}
.section{padding:48px 0 78px}
.section-title{font-size:clamp(27px,3vw,42px);line-height:1.04;letter-spacing:-.065em;margin:14px 0 0}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;margin-top:32px}
.profile-card,.featured-pinterest-card{padding:26px;background:var(--white);border:1px solid var(--ink);min-width:0;overflow:hidden}
.profile-card{grid-column:1 / -1}
.card-heading{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.board-meta{font-size:10px;color:var(--orange);font-weight:900;letter-spacing:.15em;text-transform:uppercase}
.profile-card h3,.featured-pinterest-card h3{font-size:clamp(26px,3.1vw,42px);letter-spacing:-.06em;line-height:1.05;margin:13px 0 8px}
.external{display:inline-flex;align-items:center;gap:6px;font-size:11px;line-height:1.5;font-weight:900;letter-spacing:.06em;text-decoration:underline;text-underline-offset:4px}
.profile-embed,.featured-pinterest-preview{margin:25px 0 17px;width:100%;overflow:hidden;min-height:90px}
.profile-embed{min-height:260px}
.featured-pinterest-help{font-size:13px;line-height:1.5;color:var(--muted);margin-bottom:0}
.featured-pinterest-placeholder{padding:22px;background:var(--paper);border:1px dashed var(--line);font-size:13px;line-height:1.6;color:var(--muted)}
footer{border-top:1px solid var(--ink);padding:27px 0 48px;display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:11px;text-transform:uppercase;letter-spacing:.12em;font-weight:800}
@media(max-width:720px){
  .site-header{height:75px}
  .wordmark{font-size:10px}.mark{width:38px;height:38px}
  .home-link{font-size:10px}
  .hero{padding:58px 0 45px}
  h1{font-size:clamp(56px,14vw,100px)}
  .section{padding:36px 0 55px}
  .gallery{grid-template-columns:1fr;gap:14px}
  .profile-card,.featured-pinterest-card{padding:19px}
  .profile-card{grid-column:auto}
  .profile-embed{min-height:180px}
}
</style>
</head>
<body>
<a class="skip" href="#connected">Skip to connected Pinterest</a>
<div class="shell">
  <header class="site-header">
    <a class="wordmark" href="/" aria-label="Khanyi in Motion home"><span class="mark">K</span><span>KHANYI IN MOTION</span></a>
    <a class="home-link" href="/">Back to the world ↗</a>
  </header>
  <main id="connected">
    <section class="hero" aria-labelledby="page-title">
      <div class="eyebrow">The connected visual archive</div>
      <h1 id="page-title">PINTEREST<span>.</span></h1>
    </section>
    <section class="section" aria-labelledby="connected-title">
      <div class="eyebrow">Live connections</div>
      <h2 class="section-title" id="connected-title">THE CONNECTED THINGS.</h2>
      <div class="gallery">
        <article class="profile-card">
          <div class="card-heading">
            <div><span class="board-meta">Pinterest / profile</span><h3>@khanyiinmotion</h3></div>
            <a class="external" href="https://www.pinterest.com/khanyiinmotion/" target="_blank" rel="noopener noreferrer">Open profile ↗</a>
          </div>
          <div class="profile-embed" aria-label="Public Pinterest profile">
            <a data-pin-do="embedUser"
               data-pin-board-width="880"
               data-pin-scale-height="320"
               data-pin-scale-width="95"
               href="https://www.pinterest.com/khanyiinmotion/">View @khanyiinmotion on Pinterest</a>
          </div>
        </article>
        <div id="featured-pinterest" style="display:contents" aria-label="Connected Pinterest links"></div>
      </div>
    </section>
  </main>
  <footer><span>KHANYI IN MOTION © 2026</span><span>NOT A NICHE. A LIFE IN MOTION.</span></footer>
</div>
<script async defer src="https://assets.pinterest.com/js/pinit.js" data-pinterest-script="1"></script>
<script defer src="/pinterest/live-links.js"></script>
</body>
</html>
