name: Repair homepage performance and partner navigation
on:
  push:
    paths:
      - '.github/workflows/kim-home-performance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  externalise-original-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Run reviewed, non-destructive home repair
        run: python3 scripts/repair_home.py
      - name: Verify actual WebP assets and compact HTML
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text()
          assert len(s.encode()) < 190_000, 'Homepage remains too large'
          assert s.count('data:image/webp;base64') == 0, 'Inline media remains'
          assert 'href="/for-brands.html"' in s
          assert '<meta property="og:image"' in s
          assert Path('for-brands.html').exists()
          for name in ['world-worn.webp','world-built.webp','world-moved.webp','world-lived.webp','creator-portrait.webp']:
              p=Path('assets/home')/name
              b=p.read_bytes()
              assert len(b)>1000 and b[:4]==b'RIFF' and b[8:12]==b'WEBP', name
          print('Home metadata, brand entry, five original photos and byte budget pass.')
          PY
      - name: Commit the repaired homepage and exact originals
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html sitemap.xml assets/home/
          if git diff --cached --quiet; then
            echo "Home already repaired."
            exit 0
          fi
          git commit -m "Externalise five original photos and improve brand discovery"
          git pull --rebase origin main
          git push origin HEAD:main
