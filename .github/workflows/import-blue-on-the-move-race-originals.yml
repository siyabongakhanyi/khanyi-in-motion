name: Publish original BLUE ON THE MOVE race media
on:
  push:
    paths:
      - 'khanyi_blue_on_the_move_race_originals.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish-real-race-photos-and-film:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the existing K/IM site
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: true
      - name: Validate and publish the exact user-supplied media
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          archive = Path('khanyi_blue_on_the_move_race_originals.zip')
          if not archive.exists():
              print('No upload package in this branch. No media changes.')
              raise SystemExit(0)
          folder = Path('assets/work/blue-real-life/race')
          photos = [folder / f'race-{i:02d}-{name}.jpg' for i, name in [
              (1, 'celebrate'), (2, 'on-course'), (3, 'running'), (4, 'thumbs-up'),
              (5, 'finish'), (6, 'afterglow'), (7, 'medal')
          ]]
          video = folder / 'hoka-half-film.mp4'
          expected = photos + [video]
          with ZipFile(archive, 'r') as z:
              present = set(z.namelist())
              missing = [str(p) for p in expected if str(p) not in present]
              if missing:
                  raise RuntimeError('Missing original photo/video files: ' + ', '.join(missing))
              checked = []
              for f in photos:
                  payload = z.read(str(f))
                  if not payload.startswith(bytes.fromhex('ffd8ff')) or len(payload) < 200_000:
                      raise RuntimeError(f'Photo must be the original web-ready JPEG, not a preview: {f}')
                  checked.append((f, payload))
              movie = z.read(str(video))
              if b'ftyp' not in movie[:16] or len(movie) < 100_000 or len(movie) > 25_000_000:
                  raise RuntimeError('Expected a valid web-ready MP4 under GitHub upload limits')
              checked.append((video, movie))
              for target, payload in checked:
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(payload)
                  print('Published:', target, len(payload), 'bytes')
          archive.unlink()
          PY
      - name: Commit the media without changing the archive design
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A assets/work/blue-real-life/race
          if git ls-files --error-unmatch khanyi_blue_on_the_move_race_originals.zip >/dev/null 2>&1; then
            git add -u khanyi_blue_on_the_move_race_originals.zip
          fi
          if git diff --cached --quiet; then
            echo "No files changed."
            exit 0
          fi
          git commit -m "Publish original Blue On The Move HOKA race photography and film"
          git push
