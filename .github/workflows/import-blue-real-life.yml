          match=re.search(r'<figure class="v7-card v7-worn">.*?<img src="data:image/webp;base64,([^"]+)"', html, re.S)
          if not match: raise SystemExit("Missing original blue cap portrait in homepage")
          (root/"hero-cap.webp").write_bytes(base64.b64decode(match.group(1)))
          saved=0
          for item in entries:
              for url in (item["hires"],item["original"]):
                  try:
                      req=urllib.request.Request(url,headers={"User-Agent":"Mozilla/5.0","Accept":"image/*"})
                      with urllib.request.urlopen(req,timeout=25) as response:
                          data=response.read()
                          content_type=response.headers.get("Content-Type","")
                      if not content_type.startswith("image/") or len(data)<900:
                          raise ValueError(f"Not a valid image: {content_type}, {len(data)} bytes")
                      pathlib.Path(item["path"]).write_bytes(data)
                      print("Saved",item["path"],len(data),"bytes",content_type)
                      saved+=1
                      break
                  except Exception as exc:
                      print("Retrying",item["path"],str(exc)[:220])
              else:
                  print("Could not retrieve",item["path"])
          print(f"Saved {saved} gallery photos/pages, plus hero.")
          if saved < 10: raise SystemExit("Too few images available to release the gallery")
          PY
