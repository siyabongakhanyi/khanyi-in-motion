          for item in sources:
           path=pathlib.Path(item["file"])
           path.parent.mkdir(parents=True, exist_ok=True)
           req=urllib.request.Request(item["url"], headers={"User-Agent":"Mozilla/5.0"})
           for attempt in range(3):
            try:
             with urllib.request.urlopen(req, timeout=40) as response: data=response.read()
             if not data.startswith(bytes.fromhex("ffd8")): raise ValueError("Expected real JPEG bytes from Canva")
             path.write_bytes(data)
             print(path, len(data))
             break
            except Exception as exc:
             print("retry",path,repr(exc))
             if attempt==2: raise
             time.sleep(3)
          subprocess.run(["git","config","user.email","github-actions[bot]@users.noreply.github.com"],check=True)
          subprocess.run(["git","config","user.name","github-actions[bot]"],check=True)
          subprocess.run(["git","add","assets/work/blue-real-life/lived-extra-*.jpg"],check=True)
