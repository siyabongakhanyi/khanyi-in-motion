name: Verify full-resolution blue photo
on:
  push:
    paths:
      - '.github/workflows/verify-blue-photo-resolution.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify-photo-resolution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: true
      - name: Test signed Canva asset transformations and only upgrade on success
        run: |
          python3 - <<'PY'
          import json,urllib.request,urllib.parse,struct,pathlib
          url=json.loads(r'''"https://media.canva.com/v2/image-resize/format:PNG/height:200/quality:100/uri:ifs%3A%2F%2FM%2Fa70cbe98-7414-4e6c-9299-a3716337c9cf/watermark:F/width:127?csig=AAAAAAAAAAAAAAAAAAAAAP-MDoCYwvU8ay2L3J3opvP2jECA3dQcA9cvpWFXVL-x&exp=1795376632&osig=AAAAAAAAAAAAAAAAAAAAAOM97BmsTp9NdkgpoZ8NMJKqP01nP-eZFIjMronjVbtj&signer=media-rpc&token=AAIAAU0AJGE3MGNiZTk4LTc0MTQtNGU2Yy05Mjk5LWEzNzE2MzM3YzljZgAAAAABogTJUMA-Lk2aGiAkV1oB97UhxFyQm6E8Zhi1W4jxhcqSzZ-YeQ&x-canva-quality=thumbnail"''')
          parts=urllib.parse.urlsplit(url)
          params=dict(urllib.parse.parse_qsl(parts.query,keep_blank_values=True))
          oldpath=parts.path
          path=oldpath.replace("/height:200/","/height:941/")
          import re
          path=re.sub(r"/width:\d+$","/width:598",path)
          def build(path,q):return urllib.parse.urlunsplit((parts.scheme,parts.netloc,path,urllib.parse.urlencode(q),""))
          variants=[
           ("signed_modified",build(path,params)),
           ("token_only",build(path,{k:v for k,v in params.items() if k=="token"})),
           ("token_signer",build(path,{k:v for k,v in params.items() if k in ("token","signer","exp")})),
           ("no_csig_osig",build(path,{k:v for k,v in params.items() if k not in ("csig","osig")})),
           ("no_signature_no_quality",build(path,{k:v for k,v in params.items() if k not in ("csig","osig","x-canva-quality")})),
           ("without_query",build(path,{})),
           ("no_csig_only",build(path,{k:v for k,v in params.items() if k!="csig"})),
           ("no_osig_only",build(path,{k:v for k,v in params.items() if k!="osig"})),
           ("original_thumbnail",url)
          ]
          results=[]
          for label,u in variants:
           try:
            req=urllib.request.Request(u,headers={"User-Agent":"Mozilla/5.0","Accept":"image/png,image/*"})
            with urllib.request.urlopen(req,timeout=12) as res:
             ct=res.headers.get("Content-Type","")
             b=res.read()
            wh=struct.unpack(">II",b[16:24]) if b[:8]==b"\\x89PNG\\r\\n\\x1a\\n" else (0,0)
            results.append(f"{label}: HTTP 200 {ct} {len(b)} bytes {wh}")
            if wh[0]>=450 and wh[1]>=650:
             pathlib.Path("assets/work/blue-real-life/photo-09.png").write_bytes(b)
             print("HIGH RESOLUTION FOUND",label,wh)
             break
           except Exception as e: results.append(f"{label}: {type(e).__name__} {str(e)[:120]}")
          pathlib.Path("docs/blue-photo-resolution-audit.txt").write_text("\n".join(results)+"\n")
          print("\n".join(results))
          PY
      - name: Publish audit and any upgraded asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work/blue-real-life/photo-09.png docs/blue-photo-resolution-audit.txt
          if ! git diff --cached --quiet; then
            git commit -m "Audit native blue archive image resolution"
            git push
          fi
