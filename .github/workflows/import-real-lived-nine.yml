           p=pathlib.Path(image['path']);p.parent.mkdir(parents=True, exist_ok=True)
           req=urllib.request.Request(image['url'],headers={'User-Agent':'Mozilla/5.0'})
           for trial in range(3):
            try:
             with urllib.request.urlopen(req,timeout=35) as response: data=response.read()
             if not data.startswith(bytes.fromhex('ffd8')): raise ValueError('Response is not JPEG')
             p.write_bytes(data);print('saved',p,len(data));break
            except Exception as e:
             if trial==2:raise
             print('Retry:',repr(e));time.sleep(2)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','add','assets/work/blue-real-life/real-new-*.jpg'],check=True)
          if subprocess.run(['git','diff','--cached','--quiet']).returncode:
